<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PrepWise AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
  color: white;
  display: flex;
  min-height: 100vh;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: rgba(17, 24, 39, 0.85);
  backdrop-filter: blur(12px);
  padding: 25px;
  border-right: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 35px;
  color: #38bdf8;
}

.logo span {
  color: white;
}

.menu {
  padding: 14px 16px;
  margin-bottom: 14px;
  border-radius: 14px;
  cursor: pointer;
  transition: 0.3s ease;
  background: rgba(255,255,255,0.04);
  font-weight: 500;
}

.menu:hover {
  transform: translateX(6px);
  background: linear-gradient(90deg,#38bdf8,#0ea5e9);
  box-shadow: 0 0 15px rgba(56,189,248,0.5);
}

.sidebar-footer {
  margin-top: auto;
  opacity: 0.7;
  font-size: 14px;
}

/* Main */
.main {
  flex: 1;
  padding: 25px;
  overflow-y: auto;
}

.hero {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 28px;
  margin-bottom: 25px;
  backdrop-filter: blur(12px);
}

.hero h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

.hero p {
  opacity: 0.8;
}

/* Cards */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 18px;
  margin-bottom: 25px;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px;
  padding: 22px;
  backdrop-filter: blur(12px);
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 0 25px rgba(56,189,248,0.2);
}

.card h3 {
  margin-bottom: 12px;
  font-size: 18px;
}

.card p {
  font-size: 32px;
  font-weight: bold;
  color: #38bdf8;
}

/* Chat Box */
.chat {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 22px;
  height: 420px;
  overflow-y: auto;
  margin-bottom: 20px;
}

.msg {
  margin: 14px 0;
  max-width: 80%;
  padding: 14px 18px;
  border-radius: 18px;
  line-height: 1.5;
  animation: fadeIn 0.3s ease;
}

.user {
  background: linear-gradient(90deg,#0ea5e9,#38bdf8);
  margin-left: auto;
}

.ai {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.08);
}

/* Input */
.input-box {
  display: flex;
  gap: 12px;
}

input {
  flex: 1;
  padding: 16px;
  border-radius: 18px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 15px;
}

button {
  padding: 16px 26px;
  border: none;
  border-radius: 18px;
  background: linear-gradient(90deg,#38bdf8,#0ea5e9);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 18px rgba(56,189,248,0.6);
}

/* Resume */
.resume-box {
  background: rgba(255,255,255,0.05);
  border-radius: 24px;
  padding: 22px;
  margin-top: 25px;
  border: 1px solid rgba(255,255,255,0.08);
}

.resume-box h2 {
  margin-bottom: 18px;
}

.status {
  margin-top: 12px;
  color: #34d399;
}

/* Animations */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0px);
  }
}

/* Responsive */
@media(max-width:900px){

  body {
    flex-direction: column;
    overflow-y: auto;
  }

  .sidebar {
    width: 100%;
    flex-direction: row;
    overflow-x: auto;
    gap: 12px;
  }

  .logo {
    display: none;
  }

  .menu {
    min-width: 140px;
    text-align: center;
  }
}
</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">PrepWise <span>AI 🚀</span></div>

  <div class="menu" onclick="showHome()">🏠 Home</div>
  <div class="menu" onclick="loadQuestion()">🧠 Interview</div>
  <div class="menu" onclick="loadDashboard()">📊 Dashboard</div>
  <div class="menu" onclick="showResume()">📄 Resume</div>

  <div class="sidebar-footer">
    Built with AI + FastAPI
  </div>

</div>

<div class="main">

  <div class="hero">
    <h1>Ace Your AI Interviews 🚀</h1>
    <p>Practice smarter. Get evaluated instantly. Improve continuously.</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>🎯 Interviews</h3>
      <p id="usedCount">0</p>
    </div>

    <div class="card">
      <h3>🏆 Score</h3>
      <p id="scoreCount">0</p>
    </div>

    <div class="card">
      <h3>⚡ Status</h3>
      <p id="statusCount">Free</p>
    </div>

  </div>

  <div class="chat" id="chatBox">
    <div class="msg ai">
      👋 Welcome to PrepWise AI. Click Interview to begin.
    </div>
  </div>

  <div class="input-box">
    <input type="text" id="answerInput" placeholder="Write your answer here...">
    <button onclick="submitAnswer()">Send</button>
  </div>

  <div class="resume-box" id="resumeSection" style="display:none;">
    <h2>📄 Upload Resume</h2>

    <input type="file" id="resumeFile">

    <button onclick="uploadResume()" style="margin-top:15px;">
      Upload Resume
    </button>

    <div class="status" id="resumeStatus"></div>
  </div>

</div>

<script>

const BASE_URL = "https://prepwise-ai-blme.onrender.com";

let currentQuestion = "";
let currentAnswer = "";

// -----------------------------
// LOAD QUESTION
// -----------------------------
async function loadQuestion() {

  const res = await fetch(`${BASE_URL}/get-question/python`);
  const data = await res.json();

  currentQuestion = data.question;
  currentAnswer = data.expected_answer;

  const chatBox = document.getElementById("chatBox");

  chatBox.innerHTML += `
    <div class="msg ai">
      <b>Question:</b><br>${currentQuestion}
    </div>
  `;

  chatBox.scrollTop = chatBox.scrollHeight;
}

// -----------------------------
// SUBMIT ANSWER
// -----------------------------
async function submitAnswer() {

  const input = document.getElementById("answerInput");
  const chatBox = document.getElementById("chatBox");

  const text = input.value;

  if (!text) return;

  chatBox.innerHTML += `
    <div class="msg user">
      ${text}
    </div>
  `;

  input.value = "";

  const res = await fetch(`${BASE_URL}/chat`, {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      user_id: "test1",
      question: currentQuestion,
      expected_answer: currentAnswer,
      message: text
    })
  });

  const data = await res.json();

  chatBox.innerHTML += `
    <div class="msg ai">
      ${data.reply.replace(/\n/g,"<br>")}
    </div>
  `;

  chatBox.scrollTop = chatBox.scrollHeight;

  loadDashboard();
}

// -----------------------------
// DASHBOARD
// -----------------------------
async function loadDashboard() {

  const res = await fetch(`${BASE_URL}/dashboard?user_id=test1`);

  const data = await res.json();

  document.getElementById("usedCount").innerText = data.used_interviews;
  document.getElementById("scoreCount").innerText = data.score;
  document.getElementById("statusCount").innerText = data.status;
}

// -----------------------------
// RESUME
// -----------------------------
function showResume() {

  const section = document.getElementById("resumeSection");

  if(section.style.display === "none") {
    section.style.display = "block";
  }
  else {
    section.style.display = "none";
  }
}

async function uploadResume() {

  const file = document.getElementById("resumeFile").files[0];

  const formData = new FormData();

  formData.append("file", file);

  const res = await fetch(`${BASE_URL}/upload-resume`, {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  document.getElementById("resumeStatus").innerText =
    `✅ ${data.filename} uploaded successfully`;
}

// -----------------------------
// HOME
// -----------------------------
function showHome() {

  const chatBox = document.getElementById("chatBox");

  chatBox.innerHTML = `
    <div class="msg ai">
      🚀 Welcome back to PrepWise AI.<br><br>
      Start interviews, improve your score, and master concepts.
    </div>
  `;
}

// AUTO LOAD DASHBOARD
loadDashboard();

</script>

</body>
</html>
