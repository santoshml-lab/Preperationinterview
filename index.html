<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PrepWise AI</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a, #111827);
  color: white;
  height: 100vh;
  overflow: hidden;
  display: flex;
}

.sidebar {
  width: 260px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(20px);
  border-right: 1px solid rgba(255,255,255,0.08);
  padding: 25px;
}

.logo {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 35px;
  color: #38bdf8;
}

.logo span {
  color: white;
}

.menu {
  background: rgba(255,255,255,0.05);
  margin-bottom: 14px;
  padding: 14px;
  border-radius: 14px;
  cursor: pointer;
  transition: 0.3s ease;
  font-weight: 500;
}

.menu:hover {
  background: #38bdf8;
  color: black;
  transform: translateX(4px);
}

.main {
  flex: 1;
  padding: 25px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.title {
  font-size: 30px;
  font-weight: 700;
}

.badge {
  background: rgba(56,189,248,0.15);
  color: #38bdf8;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(56,189,248,0.2);
}

.question-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 16px;
  font-size: 18px;
  line-height: 1.5;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
}

.msg {
  margin-bottom: 16px;
  max-width: 75%;
  padding: 14px 18px;
  border-radius: 18px;
  line-height: 1.6;
  animation: fadeIn 0.3s ease;
}

.user {
  margin-left: auto;
  background: #38bdf8;
  color: black;
}

.ai {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.06);
}

.input-box {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

input {
  flex: 1;
  padding: 16px;
  border-radius: 16px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 15px;
}

input::placeholder {
  color: rgba(255,255,255,0.5);
}

button {
  border: none;
  padding: 15px 20px;
  border-radius: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s ease;
}

.send-btn {
  background: #38bdf8;
  color: black;
}

.send-btn:hover {
  transform: scale(1.05);
}

.next-btn {
  background: rgba(255,255,255,0.08);
  color: white;
}

.next-btn:hover {
  background: rgba(255,255,255,0.16);
}

.dashboard {
  display: none;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06);
  padding: 22px;
  border-radius: 20px;
}

.card h3 {
  margin-bottom: 10px;
  font-size: 16px;
  opacity: 0.8;
}

.card p {
  font-size: 30px;
  font-weight: 700;
}

.resume {
  display: none;
  background: rgba(255,255,255,0.05);
  padding: 25px;
  border-radius: 20px;
}

.upload-btn {
  margin-top: 14px;
  background: #22c55e;
  color: white;
}

.footer {
  margin-top: 12px;
  text-align: center;
  opacity: 0.6;
  font-size: 13px;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0px);
  }
}

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-thumb {
  background: #38bdf8;
  border-radius: 20px;
}

@media(max-width: 900px) {

  body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    display: flex;
    overflow-x: auto;
    gap: 10px;
  }

  .logo {
    display: none;
  }

  .menu {
    min-width: 140px;
    text-align: center;
  }

  .title {
    font-size: 22px;
  }

  .msg {
    max-width: 90%;
  }
}
</style></head><body><div class="sidebar">
  <div class="logo">PrepWise <span>AI</span> 🚀</div>  <div class="menu" onclick="showChat()">💬 AI Interview</div>
  <div class="menu" onclick="loadDashboard()">📊 Dashboard</div>
  <div class="menu" onclick="showResume()">📄 Resume</div>
</div><div class="main">  <div class="topbar">
    <div class="title">AI Mock Interview</div>
    <div class="badge">Powered by AI ⚡</div>
  </div>  <!-- CHAT SECTION -->  <div id="chatSection"><div class="question-box" id="questionBox">
  Loading interview question...
</div>

<div class="chat" id="chatBox"></div>

<div class="input-box">
  <input
    type="text"
    id="input"
    placeholder="Write your answer here..."
  />

  <button class="next-btn" onclick="loadQuestion()">
    Next
  </button>

  <button class="send-btn" onclick="send()">
    Send
  </button>
</div>

  </div>  <!-- DASHBOARD -->  <div class="dashboard" id="dashboardBox"></div>  <!-- RESUME -->  <div class="resume" id="resumeBox"><h2>📄 Upload Resume</h2>

<br>

<input type="file" id="fileInput">

<button class="upload-btn" onclick="uploadResume()">
  Upload Resume
</button>

<br><br>

<div id="resumeStatus"></div>

  </div>  <div class="footer">
    Built with ambition, caffeine, and AI 🤖
  </div></div><script>

const BASE_URL = "https://prepwise-ai-blme.onrender.com";

let currentQuestion = "";
let expectedAnswer = "";

// LOAD QUESTION
async function loadQuestion() {

  try {

    let res = await fetch(`${BASE_URL}/get-question`);

    let data = await res.json();

    currentQuestion = data.question;
    expectedAnswer = data.expected_answer;

    document.getElementById("questionBox").innerHTML =
      `🎯 ${data.question}`;

  } catch(err) {
    console.log(err);
  }
}

loadQuestion();

// SEND ANSWER
async function send() {

  let input = document.getElementById("input");
  let chatBox = document.getElementById("chatBox");

  let text = input.value;

  if(!text) return;

  chatBox.innerHTML += `
    <div class="msg user">
      ${text}
    </div>
  `;

  input.value = "";

  chatBox.innerHTML += `
    <div class="msg ai" id="loading">
      🤖 AI is evaluating your answer...
    </div>
  `;

  chatBox.scrollTop = chatBox.scrollHeight;

  try {

    let res = await fetch(`${BASE_URL}/chat`, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        user_id: "test1",
        question: currentQuestion,
        expected_answer: expectedAnswer,
        message: text
      })
    });

    let data = await res.json();

    document.getElementById("loading").remove();

    chatBox.innerHTML += `
      <div class="msg ai">
        ${data.reply.replace(/\n/g, "<br>")}
      </div>
    `;

    chatBox.scrollTop = chatBox.scrollHeight;

  } catch(err) {

    console.log(err);

    document.getElementById("loading").innerHTML =
      "⚠️ Server Error";
  }
}

// DASHBOARD
async function loadDashboard() {

  document.getElementById("chatSection").style.display = "none";
  document.getElementById("resumeBox").style.display = "none";
  document.getElementById("dashboardBox").style.display = "block";

  let res = await fetch(
    `${BASE_URL}/dashboard?user_id=test1`
  );

  let data = await res.json();

  document.getElementById("dashboardBox").innerHTML = `

    <h1>📊 Dashboard</h1>

    <div class="cards">

      <div class="card">
        <h3>🎯 Interviews</h3>
        <p>${data.used_interviews}</p>
      </div>

      <div class="card">
        <h3>🏆 Score</h3>
        <p>${data.score}</p>
      </div>

      <div class="card">
        <h3>⚡ Status</h3>
        <p>${data.status}</p>
      </div>

      <div class="card">
        <h3>📌 Limit</h3>
        <p>${data.free_limit}</p>
      </div>

    </div>

  `;
}

// RESUME SECTION
function showResume() {

  document.getElementById("chatSection").style.display = "none";
  document.getElementById("dashboardBox").style.display = "none";
  document.getElementById("resumeBox").style.display = "block";
}

// SHOW CHAT
function showChat() {

  document.getElementById("chatSection").style.display = "block";
  document.getElementById("dashboardBox").style.display = "none";
  document.getElementById("resumeBox").style.display = "none";
}

// RESUME UPLOAD
async function uploadResume() {

  let file = document.getElementById("fileInput").files[0];

  if(!file) {
    alert("Select a file first");
    return;
  }

  let formData = new FormData();
  formData.append("file", file);

  let res = await fetch(`${BASE_URL}/upload-resume`, {
    method: "POST",
    body: formData
  });

  let data = await res.json();

  document.getElementById("resumeStatus").innerHTML = `
    ✅ Uploaded: ${data.filename}
  `;
}

</script></body>
</html>
